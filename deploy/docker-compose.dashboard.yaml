# Add this service to your existing docker-compose.yaml
# Or use: docker compose -f docker-compose.yaml -f deploy/docker-compose.dashboard.yaml up -d

services:
  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
    container_name: billboard-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - MUSIC_WAREHOUSE_DATABASE_URL=${MUSIC_WAREHOUSE_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

