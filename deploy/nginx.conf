# Nginx configuration for Billboard Dashboard
# Place this in /etc/nginx/sites-available/billboard-dashboard
# Then create symlink: sudo ln -s /etc/nginx/sites-available/billboard-dashboard /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx
#
# After setting up SSL with Let's Encrypt, certbot will automatically update this config.
# Or use the HTTPS version below.

# HTTP server - redirects to HTTPS after SSL is set up
server {
    listen 80;
    server_name dashboard.your-domain.com;  # Replace with your domain!

    # Uncomment after SSL is set up to redirect HTTP to HTTPS
    # return 301 https://$server_name$request_uri;

    # Increase timeouts for long-running queries
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_buffering off;
    }

    # Optional: Add basic authentication
    # auth_basic "Restricted Access";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}

